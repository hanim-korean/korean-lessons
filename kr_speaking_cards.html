<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말하기 카드 · Allbarun Korean</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
.learning-material{--ink:#263c30;--muted:#52634f;--accent:#526c3d;--line:#dfe6db;--control:#c5d0bd;--paper:#fdfefd;--tint:#edf3e3;--warm:#f3f7ed;--selected:#e4edcf;--retry:#934629;--retry-soft:#fff1e9;
 margin:0;padding:32px 24px 56px;color:var(--ink);background:var(--paper);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.learning-material *,.learning-material *::before,.learning-material *::after{box-sizing:border-box}
.learning-material [hidden]{display:none!important}
.learning-material :is(button,input,select,textarea){font-family:inherit;font-size:16px;color:var(--ink)}
.learning-material :is(button,select){cursor:pointer;min-height:44px}
.learning-material :is(button,input,select,textarea,a,summary):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.learning-material a{color:var(--accent);text-underline-offset:4px}
.learning-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px 24px;max-width:var(--page-width,780px);margin:0 auto 28px;padding:0 0 24px;border-bottom:1px solid var(--line)}
.learning-back{display:flex;align-items:center;width:fit-content;min-height:44px;margin:0 0 8px;font-size:15px;color:var(--muted);text-decoration:none}
.learning-back:hover{text-decoration:underline}
.learning-header h1{margin:0;font-size:30px;font-weight:600;line-height:1.3;letter-spacing:-.025em}
.learning-subtitle{display:block;margin:0;font-size:15px;line-height:1.4;color:var(--muted)}
.learning-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.learning-tools button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:1px solid var(--control);border-radius:8px;background:#fff}
.learning-tools button:hover{background:var(--warm)}
.learning-tools button[aria-pressed=true]{border-color:var(--accent);background:var(--selected)}
.learning-body{max-width:var(--page-width,780px);margin:0 auto;min-width:0}
.learning-body>section{padding:28px 0;border-top:1px solid var(--line)}
.learning-body>section:first-child{border-top:0;padding-top:0}
h2{font-size:22px;font-weight:600;line-height:1.45;letter-spacing:-.02em;margin:0}
h2+.en{display:block;margin:0 0 18px}
h3{font-size:18px;font-weight:600;margin:22px 0 6px;line-height:1.45}
h3+.en{display:block;margin:0 0 10px}
p{margin:10px 0}
.en{font-size:15px;line-height:1.4;color:var(--muted)}
p.en{margin-top:0}
p:has(+p.en){margin-bottom:0}
.ko{font-weight:600}
.hl{color:var(--accent);font-weight:700}
.chg{color:var(--retry);font-weight:700}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:14px;font-weight:600;background:var(--tint);color:var(--accent)}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin:8px 0 4px}
th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{font-size:15px;font-weight:600;color:var(--muted)}
th:first-child,td:first-child{padding-left:0}
td .en,th .en{display:block}
th .en{font-weight:400;font-size:14px}
.table-scroll{overflow-x:auto}
ul.plain{list-style:none;padding:0;margin:8px 0}
ul.plain>li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.plain>li:last-child{border-bottom:0}
ul.plain .en{display:block}
.panel{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:#fff}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin:0 0 20px}
.seg button,.btn{min-height:44px;padding:10px 14px;border:1px solid var(--control);border-radius:8px;background:#fff;text-align:center}
.seg button:hover,.btn:hover{background:var(--warm);border-color:var(--accent)}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600}
.learning-material .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.learning-material .btn-primary:hover{background:#354a30;color:#fff}
.learning-material .seg button[aria-pressed=true]{color:#fff}
.quiz{display:grid;gap:24px}
.q{padding:0 0 24px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.ask{font-weight:600;margin-bottom:12px}
.ask .en{display:block;font-weight:400}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.opts button{min-height:44px;padding:10px 12px;border:1px solid var(--control);border-radius:8px;background:#fff;text-align:center}
.opts button:hover{background:var(--warm);border-color:var(--accent)}
.opts button.right{border-color:var(--accent);background:var(--tint);font-weight:600}
.opts button.right::before{content:"✓ ";}
.opts button.wrong{border-color:var(--retry);background:var(--retry-soft)}
.opts button.wrong::before{content:"× ";}
.fb{margin-top:10px;font-size:15px;line-height:1.6}
.fb:empty{display:none}
.score{font-weight:600;margin-top:20px;font-size:17px}
.score:empty{display:none}
.learning-action-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.learning-action-row>:last-child{margin-inline-start:auto}
.learning-action-row .btn{min-width:160px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
body.hide-en .en{display:none!important}
@media(max-width:620px){
 .learning-material{padding:24px 18px 40px}
 .learning-header{grid-template-columns:minmax(0,1fr);gap:16px}
 .learning-header h1{font-size:26px}
 h2{font-size:20px}
 .two{grid-template-columns:1fr}
 .opts,.seg{grid-auto-flow:row;grid-template-columns:1fr}
 .seg.keep{grid-auto-flow:column;grid-template-columns:none}
}
@media(prefers-reduced-motion:reduce){.learning-material *{transition:none!important;animation:none!important}}

.learning-material{--page-width:780px}

.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:end;margin-bottom:20px}
.controls label,.controls .lab{display:grid;gap:6px;color:#52634f;font-size:15px}
.controls select{min-height:44px;padding:8px 12px;border:1px solid #c5d0bd;border-radius:8px;background:#fff}
.controls .seg{margin:6px 0 0}
.card{border:1px solid #dfe6db;border-radius:14px;background:#fff;padding:24px 24px 20px;min-height:300px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .count{margin-left:auto;color:#52634f;font-size:15px;font-variant-numeric:tabular-nums}
.card .q{font-size:30px;font-weight:600;line-height:1.35;margin:22px 0 4px;letter-spacing:-.02em}
.card .sit{font-size:18px;margin:12px 0 0}
.reveal-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
.reveal-row .btn[aria-expanded=true]{border-color:#526c3d;background:#e4edcf}
.more{margin-top:16px;padding-top:12px;border-top:1px solid #dfe6db}
.more .lab{color:#52634f;font-size:14px;margin:8px 0 2px}
.more .frame{font-size:20px;font-weight:600;color:#526c3d;margin:0 0 6px}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
@media(max-width:620px){.controls{grid-template-columns:1fr}.card .q{font-size:24px}.card{padding:20px 18px}}
</style>
</head>

<header class="learning-header"><div class="learning-heading"><a class="learning-back" href="./learn/index.html" target="_top">자료 목록</a><h1>말하기 카드</h1><p class="learning-subtitle">Speaking cards</p></div><div class="learning-tools"><button type="button" id="toggle-en" aria-pressed="false">영어 숨기기 Hide English</button></div></header>

<section>

 <label>주제 Topic<select id="deck"><option value="all">모든 주제 All topics</option><option value="me">나와 일상 Me and daily life</option><option value="food">음식 Food</option><option value="travel">여행 Travel</option><option value="past">지난 일 Past experiences</option><option value="opinion">생각 말하기 Sharing opinions</option><option value="role">역할극 Role-play</option></select></label>

</section>

<script>
function renderQuiz(items, root, scoreEl){
  let solvedCount=0, firstTry=0;
  items.forEach((it,i)=>{
    const box=document.createElement('div'); box.className='q';
    const ask=document.createElement('div'); ask.className='ask';
    ask.innerHTML=(i+1)+'. '+it.q+(it.en?'<span class="en">'+it.en+'</span>':'');
    const opts=document.createElement('div'); opts.className='opts';
    const fb=document.createElement('div'); fb.className='fb'; fb.setAttribute('aria-live','polite');
    let tried=false, solved=false;
    it.opts.forEach((o,j)=>{
      const b=document.createElement('button'); b.type='button'; b.textContent=o; b.setAttribute('aria-pressed','false');
      b.addEventListener('click',()=>{
        if(solved) return;
        opts.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
        if(j===it.a){
          solved=true; b.classList.add('right');
          fb.innerHTML='<b>맞아요! Correct!</b> '+it.fb;
          if(!tried) firstTry++;
          solvedCount++;
          if(solvedCount===items.length) scoreEl.textContent='처음에 맞힌 문제: '+firstTry+' / '+items.length+' · Right on the first try';
        }else{
          b.classList.add('wrong'); b.disabled=true;
          fb.innerHTML='<b>다시 해 봐요. Try again.</b> '+(it.hint||'');
        }
        tried=true;
      });
      opts.appendChild(b);
    });
    box.append(ask,opts,fb); root.appendChild(box);
  });
}
function resetQuiz(items, root, scoreEl){ root.innerHTML=''; scoreEl.textContent=''; renderQuiz(items, root, scoreEl); }


(()=>{const b=document.getElementById('toggle-en'); if(!b) return;
 b.addEventListener('click',()=>{const on=document.body.classList.toggle('hide-en'); b.setAttribute('aria-pressed',String(on)); b.textContent=on?'영어 보기 Show English':'영어 숨기기 Hide English';});})();

w": ["먹어 본 음식 중에서 제일 매운 음식이 뭐예요?", "떡볶이를 먹어 봤어요?"]}, {"lv": "초급 2", "q": "한국 음식을 먹어 봤어요?", "en": "Have you tried Korean food?", "frame": "네, ___을/를 먹어 봤어요.", "ex": "네, 비빔밥을 먹어 봤어요. 맛있었어요.", "follow": ["어디에서 먹었어요?", "또 먹고 싶은 음식이 있어요?"]}, {"lv": "중급", "q": "고향의 유명한 음식을 소개해 주세요.", "en": "Tell me about a famous food from your hometown.", "frame": "제 고향에서는 ___이/가 유명해요. ___(으)로 만들어요.", "ex": "제 고향에서는 피자가 유명해요. 밀가루와 토마토로 만들어요.", "follow": ["보통 언제 먹어요?", "한국 음식 중에 비슷한 음식이 있어요?"]}]}, {"id": "travel", "name": "여행", "en": "Travel", "cards": [{"lv": "초급 2", "q": "어디에 가 보고 싶어요?", "en": "Where would you like to go?", "frame": "___에 가 보고 싶어요.", "ex": "제주도에 가 보고 싶어요. 바다를 보고 싶어요.", "follow": ["왜요?", "누구하고 가고 싶어요?"]}, {"lv": "초급 2", "q": "여행 가면 보통 뭐 해요?", "en": "What do you usually do when you travel?", "frame": "여행 가면 보통 ___아요/어요.", "ex": "여행 가면 보통 많이 걸어요. 시장에도 가요.", "follow": ["여행 갈 때 꼭 가져가는 물건이 있어요?", "사진을 많이 찍어요?"]}, {"lv": "초급 2", "q": "한국에 가면 뭘 하고 싶어요?", "en": "What would you like to do in Korea?", "frame": "한국에 가면 ___고 싶어요.", "ex": "한국에 가면 한옥 마을을 구경하고 싶어요.", "follow": ["어느 도시에 가고 싶어요?", "한국어로 뭘 주문하고 싶어요?"]}, {"lv": "초급 2", "q": "비행기가 좋아요? 기차가 좋아요?", "en": "Do you prefer planes or trains?", "frame": "저는 ___이/가 더 좋아요. ___아서/어서요.", "ex": "저는 기차가 더 좋아요. 창밖을 볼 수 있어서요.", "follow": ["기차에서 보통 뭐 해요?", "제일 오래 탄 비행기는 몇 시간이었어요?"]}, {"lv": "중급", "q": "마지막으로 여행한 곳이 어디예요?", "en": "Where was the last place you traveled to?", "frame": "마지막으로 여행한 곳은 ___이에요/예요.", "ex": "마지막으로 여행한 곳은 이탈리아예요. 음식이 정말 맛있었어요.", "follow": ["거기에서 뭐가 제일 좋았어요?", "또 가고 싶어요?"]}]}, {"id": "past", "name": "지난 일", "en": "Past experiences", "cards": [{"lv": "초급 2", "q": "어제 뭐 했어요?", "en": "What did you do yesterday?", "frame": "어제 ___았어요/었어요.", "ex": "어제 친구를 만나서 저녁을 먹었어요.", "follow": ["몇 시에 집에 왔어요?", "재미있었어요?"]}, {"lv": "초급 2", "q": "지난 주말에 어디에 갔어요?", "en": "Where did you go last weekend?", "frame": "지난 주말에 ___에 갔어요.", "ex": "지난 주말에 공원에 갔어요. 산책했어요.", "follow": ["누구하고 갔어요?", "날씨가 어땠어요?"]}, {"lv": "초급 2", "q": "최근에 본 영화나 드라마가 있어 let deck='all', lv='all', list=[], i=0;
const $=id=>document.getElementById(id);
function build(){
  list=[]; DECKS.forEach(d=>{ if(deck!=='all'&&d.id!==deck) return; d.cards.forEach(c=>{ if(lv==='all'||c.lv===lv) list.push({...c,deck:d.name}); }); });
  i=0; show();
}
function esc(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));}
function show(){
  ['m-help','m-follow'].forEach(id=>$(id).hidden=true);
  ['b-help','b-follow'].forEach(id=>$(id).setAttribute('aria-expanded','false'));
  if(!list.length){ $('c-q').textContent='이 수준의 카드가 없어요.'; $('c-en').textContent='No cards for this level in this topic.'; $('c-sit').hidden=true; $('c-deck').textContent=''; $('c-lv').textContent=''; $('c-count').textContent=''; return; }
  const c=list[i];
  $('c-deck').textContent=c.deck; $('c-lv').textContent=c.lv; $('c-count').textContent=(i+1)+' / '+list.length;
  $('c-q').textContent=c.q; $('c-en').textContent=c.en;
  if(c.role){
    $('c-sit').hidden=false; $('c-sit').textContent=c.roles;
    $('m-help').innerHTML='<p class="lab">쓸 수 있는 말 Useful expressions</p><ul class="plain">'+c.help.map(h=>'<li>'+esc(h)+'</li>').join('')+'</ul>';
    $('b-follow').textContent='상황 바꾸기 Twist';
    $('m-follow').innerHTML='<p>'+esc(c.twist)+'</p><p class="en">'+esc(c.twist_en)+'</p>';
  }else{
    $('c-sit').hidden=true;
    $('m-help').innerHTML='<p class="lab">이렇게 시작해요 Sentence frame</p><p class="frame">'+esc(c.frame)+'</p><p class="lab">예 Example</p><p>'+esc(c.ex)+'</p>';
    $('b-follow').textContent='꼬리 질문 Follow-up';
    $('m-follow').innerHTML='<ul class="plain">'+c.follow.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>';
  }
}
function toggle(btn,box){ const open=$(box).hidden; $(box).hidden=!open; $(btn).setAttribute('aria-expanded',String(open)); }
$('b-help').addEventListener('click',()=>toggle('b-help','m-help'));
$('b-follow').addEventListener('click',()=>toggle('b-follow','m-follow'));
$('next').addEventListener('click',()=>{ if(!list.length) return; i=(i+1)%list.length; show(); });
$('prev').addEventListener('click',()=>{ if(!list.length) return; i=(i-1+list.length)%list.length; show(); });
$('shuffle').addEventListener('click',()=>{ for(let k=list.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[list[k],list[j]]=[list[j],list[k]];} i=0; show(); });
$('deck').addEventListener('change',e=>{ deck=e.target.value; build(); });
document.querySelectorAll('#level button').forEach(b=>b.addEventListener('click',()=>{ lv=b.dataset.lv; document.querySelectorAll('#level button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); build(); }));
document.addEventListener('keydown',e=>{ if(e.target.closest('select,input,textarea')) return; if(e.key==='ArrowRight') $('next').click(); if(e.key==='ArrowLeft') $('prev').click(); });
build();
</script>
