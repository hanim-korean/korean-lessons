<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국어 숫자 카드 · Allbarun Korean</title>
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --coral: #E8604C;
    --teal: #2E9E8A;
    --slate: #3D4A5C;
    --gold: #C8902A;
    --purple: #7C5CBF;
    --bg: #F7F5F2;
    --card-bg: #FFFFFF;
    --text: #1A1A2E;
    --muted: #6B7280;
    --border: #E5E7EB;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  header { text-align: center; margin-bottom: 10px; }
  header h1 { font-size: 28px; font-weight: 700; color: var(--slate); letter-spacing: -0.5px; }
  header .byline { font-size: 12px; color: var(--muted); margin-top: 3px; letter-spacing: 0.5px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* mode toggle */
  .mode-toggle {
    display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px;
    background: white; border: 2px solid var(--border); border-radius: 24px; padding: 4px;
    width: fit-content;
  }
  .mode-btn {
    padding: 5px 16px; border-radius: 18px; font-size: 12px; font-weight: 700;
    border: none; cursor: pointer; transition: all .2s; font-family: 'DM Sans', sans-serif;
    color: var(--muted); background: transparent;
  }
  .mode-btn.active { background: var(--slate); color: white; }

  /* category pills */
  .cats { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px; }
  .cat-btn {
    padding: 5px 15px; border-radius: 18px; font-size: 12px; font-weight: 700;
    border: 2px solid transparent; cursor: pointer; transition: all .2s;
    font-family: 'DM Sans', sans-serif;
  }
  .cat-btn.active { color: white; }
  .cat-btn[data-cat="all"]    { border-color: var(--slate);  color: var(--slate); }
  .cat-btn[data-cat="sino"]   { border-color: var(--coral);  color: var(--coral); }
  .cat-btn[data-cat="native"] { border-color: var(--teal);   color: var(--teal);  }
  .cat-btn[data-cat="time"]   { border-color: var(--slate);  color: var(--slate); }
  .cat-btn[data-cat="age"]    { border-color: var(--gold);   color: var(--gold);  }
  .cat-btn[data-cat="phone"]  { border-color: var(--purple); color: var(--purple);}
  .cat-btn[data-cat="ordinal"]{ border-color: #0EA5A0;       color: #0EA5A0;      }
  .cat-btn[data-cat="all"].active    { background: var(--slate); }
  .cat-btn[data-cat="sino"].active   { background: var(--coral); }
  .cat-btn[data-cat="native"].active { background: var(--teal);  }
  .cat-btn[data-cat="time"].active   { background: var(--slate); }
  .cat-btn[data-cat="age"].active    { background: var(--gold);  }
  .cat-btn[data-cat="phone"].active  { background: var(--purple);}
  .cat-btn[data-cat="ordinal"].active{ background: #0EA5A0;      }

  /* progress */
  .progress-wrap { width: 100%; max-width: 540px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--coral); transition: none; }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; font-family: 'DM Mono', monospace; }

  /* card */
  .card-scene { width: 100%; max-width: 540px; height: 320px; perspective: 1000px; cursor: pointer; margin-bottom: 22px; }
  .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  .card-front { background: var(--card-bg); border: 2px solid var(--border); }
  .card-back { background: var(--card-bg); border: 2px solid var(--border); transform: rotateY(180deg); }

  .card-tag { position: absolute; top: 16px; left: 20px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; color: white; }
  .tag-sino    { background: var(--coral); }
  .tag-native  { background: var(--teal);  }
  .tag-time    { background: var(--slate); }
  .tag-age     { background: var(--gold);  }
  .tag-phone   { background: var(--purple);}
  .tag-ordinal { background: #0EA5A0;      }

  .card-hint { position: absolute; top: 16px; right: 20px; font-size: 11px; color: var(--muted); }
  .card-dir  { position: absolute; bottom: 14px; right: 18px; font-size: 9px; color: var(--border); font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }

  .card-question { font-family: 'Noto Sans KR', sans-serif; font-size: 64px; font-weight: 700; color: var(--slate); text-align: center; line-height: 1.1; }
  .card-question.en { font-family: 'DM Sans', sans-serif; font-size: 38px; }
  .card-question.num { font-family: 'DM Mono', monospace; font-size: 56px; color: var(--slate); }
  .card-sub { font-size: 14px; color: var(--muted); margin-top: 10px; font-weight: 500; text-align: center; }

  .card-answer-main { font-family: 'Noto Sans KR', sans-serif; font-size: 52px; font-weight: 700; text-align: center; line-height: 1.1; white-space: pre-line; }
  .card-answer-main.en { font-family: 'DM Sans', sans-serif; font-size: 38px; }
  .card-answer-rom  { font-family: 'DM Mono', monospace; font-size: 18px; color: var(--muted); margin-top: 8px; }
  .card-answer-pron { font-size: 15px; font-weight: 600; margin-top: 5px; }
  .card-answer-note { font-size: 12px; color: var(--muted); margin-top: 9px; text-align: center; max-width: 360px; line-height: 1.55; white-space: pre-line; }

  /* nav */
  .nav { display: flex; gap: 12px; align-items: center; }
  .nav-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border); background: white; font-size: 20px; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; }
  .nav-btn:hover { border-color: var(--coral); color: var(--coral); transform: scale(1.05); }
  .flip-btn { padding: 12px 32px; border-radius: 24px; background: var(--slate); color: white; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .2s; }
  .flip-btn:hover { background: var(--coral); transform: scale(1.02); }

  .kbd-hint { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
  kbd { background: var(--border); padding: 2px 6px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 11px; }
</style>
<style>
/* Number-card learning material: preserve the recall activity within the common learning shell. */
body.learning-material {
  --coral:#b84835; --teal:#247867; --slate:#44583d;
  --gold:#906115; --purple:#7252ad; --bg:#f7f7f2;
  --card-bg:#fffef9; --text:#263c30; --muted:#5d6c58; --border:#dce2d4;
  display:block; padding:0; color:var(--text);
  font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:16px; line-height:1.65;
}
.learning-material .learning-header { text-align:left; margin-bottom:0; }
.learning-material .learning-header h1 { color:var(--text); letter-spacing:-.025em; }
.learning-material .learning-header p { font-size:15px; margin-top:0; }
.learning-material .learning-tools button { font-family:inherit; min-height:44px; }
.learning-material .learning-body { width:min(1120px,calc(100% - 40px)); margin:0 auto; padding:28px 0 48px; }
.learning-material .number-practice { max-width:680px; margin:0 auto; display:flex; flex-direction:column; align-items:center; }
.learning-material .mode-toggle { margin:0 0 10px; border:1px solid var(--border); border-radius:12px; max-width:100%; flex-wrap:wrap; justify-content:center; }
.learning-material .mode-btn { font-family:inherit; font-size:16px; min-height:44px; border-radius:8px; padding:8px 16px; }
.learning-material .mode-btn.active { background:var(--slate); }
.learning-material .mode-help { font-size:15px; color:var(--muted); text-align:center; margin:0 0 20px; }
.learning-material .cats { gap:8px; margin-bottom:24px; }
.learning-material .cat-btn { font-family:inherit; font-size:15px; min-height:44px; padding:7px 13px; border-width:1px; border-radius:9px; background:transparent; }
.learning-material .cat-btn.active { color:#fff; }
.learning-material .cat-btn[data-cat="ordinal"] { color:#22756e; border-color:#22756e; }
.learning-material .cat-btn[data-cat="ordinal"].active { color:#fff; background:#22756e; }
.learning-material .progress-wrap { max-width:640px; margin-bottom:16px; }
.learning-material .progress-label { font-family:inherit; font-variant-numeric:tabular-nums; font-size:15px; }
.learning-material .card-scene { max-width:640px; height:auto; min-height:360px; margin-bottom:24px; border-radius:12px; }
.learning-material .card-inner { display:grid; height:auto; min-height:inherit; }
.learning-material .card-face { grid-area:1 / 1; position:relative; inset:auto; min-width:0; min-height:360px; padding:66px 24px 40px; border:1px solid var(--border); border-radius:12px; box-shadow:0 3px 8px rgb(38 60 48 / 7%); overflow-wrap:anywhere; }
.learning-material .card-tag { font-size:14px; line-height:1.5; letter-spacing:0; text-transform:none; padding:3px 10px; border-radius:6px; top:16px; left:18px; }
.learning-material .card-hint { font-size:14px; top:20px; right:18px; }
.learning-material .card-dir { font-family:inherit; font-size:14px; color:var(--muted); letter-spacing:0; }
.learning-material .card-question,
.learning-material .card-question.en,
.learning-material .card-question.num { font-family:inherit; font-size:clamp(30px,7vw,56px); font-weight:650; line-height:1.3; white-space:pre-line; font-variant-numeric:tabular-nums; }
.learning-material .card-answer-main,
.learning-material .card-answer-main.en { font-family:inherit; font-size:clamp(28px,6.4vw,48px); font-weight:650; line-height:1.35; }
.learning-material .card-sub { font-size:16px; line-height:1.65; white-space:pre-line; max-width:46ch; }
.learning-material .card-answer-rom { font-family:inherit; font-size:16px; line-height:1.5; text-align:center; }
.learning-material .card-answer-pron { font-size:16px; line-height:1.5; text-align:center; }
.learning-material .card-answer-note { font-size:15px; line-height:1.65; max-width:48ch; }
.learning-material .nav { max-width:100%; gap:12px; }
.learning-material .nav-btn { min-width:48px; border:1px solid var(--border); border-radius:10px; color:var(--text); }
.learning-material .nav-btn:hover { color:var(--slate); border-color:var(--slate); transform:none; }
.learning-material .flip-btn { font-family:inherit; min-height:48px; font-size:16px; padding:10px 28px; border-radius:10px; }
.learning-material .flip-btn:hover { background:#354a30; transform:none; }
.learning-material .kbd-hint { font-size:15px; line-height:1.8; margin-top:20px; }
.learning-material kbd { font-size:14px; }
.learning-material :is(button,a,[tabindex]):focus-visible { outline:3px solid #5b7046; outline-offset:4px; }
.learning-material ::selection { background:#dce6cc; color:#263c30; }
@media(max-width:480px) {
  .learning-material .learning-body { width:calc(100% - 32px); padding-top:22px; }
  .learning-material .mode-toggle { width:100%; }
  .learning-material .mode-btn { flex:1 1 130px; padding-inline:8px; }
  .learning-material .card-scene,.learning-material .card-face { min-height:370px; }
  .learning-material .card-face { padding:82px 18px 40px; }
  .learning-material .card-tag { left:14px; top:14px; }
  .learning-material .card-hint { top:47px; right:auto; left:14px; }
  .learning-material .card-dir { right:14px; }
  .learning-material .flip-btn { padding-inline:20px; }
}
@media(prefers-reduced-motion:reduce) {
  .learning-material .card-inner,.learning-material .progress-fill { transition:none; }
}
@media print {
  .learning-material .learning-tools,.learning-material .learning-back,.learning-material .kbd-hint { display:none; }
  .learning-material .card-scene { perspective:none; }
}
</style>

<style>/* Shared learning surface, extracted from the approved Tiger and Gotgam lesson. */
.learning-material {
  --learning-title-size:30px;
  --learning-section-size:22px;
  --learning-body-size:16px;
  --page-heading-size:var(--learning-title-size);
  --learning-ink: #263c30;
  --learning-muted: #52634f;
  --learning-accent: #526c3d;
  --learning-line: #dfe6db;
  --learning-control-line: #c5d0bd;
  --learning-paper: #fdfefd;
  --learning-sheet: #fff;
  --learning-tint: #edf3e3;
  --learning-warm: #f3f7ed;
  --learning-selected: #e4edcf;
  --learning-radius: 14px;
  --learning-radius-control: 8px;
  --learning-radius-small: 4px;
  --learning-shadow: 0 3px 8px rgb(38 60 48 / 7%);
  --learning-font: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  --ink: var(--learning-ink);
  --muted: var(--learning-muted);
  --line: var(--learning-line);
  --blue: var(--learning-accent);
  --pale: var(--learning-tint);
  --paper: var(--learning-paper);
  --warm: var(--learning-warm);
  --radius: var(--learning-radius);
  margin: 0;
  color: var(--learning-ink);
  background: var(--learning-paper);
  font-family: var(--learning-font);
  font-size:var(--learning-body-size);
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
}
.learning-material *, .learning-material *::before, .learning-material *::after { box-sizing: border-box; }
.learning-material [hidden] { display: none !important; }
.learning-material :is(button, input, select, textarea) { font-family: inherit; }
.learning-material :is(button, select, summary) { cursor: pointer; }
.learning-material :is(button, select, summary, input:not([type=checkbox]):not([type=radio])) { min-height: 44px; }
.learning-material :is(button, input, select, textarea, summary, a, [tabindex]):focus-visible {
  outline: 2px solid var(--learning-accent);
  outline-offset: 3px;
}
.learning-material :is(input, textarea) { caret-color: var(--learning-accent); }
.learning-material :is(input, textarea)::placeholder { color: var(--learning-muted); opacity: 1; }
.learning-material ::selection { background: var(--learning-selected); color: var(--learning-ink); }
.learning-material { scrollbar-color: var(--learning-control-line) var(--learning-paper); }
.learning-material ::-webkit-scrollbar { width: 9px; height: 9px; }
.learning-material ::-webkit-scrollbar-thumb { background: var(--learning-control-line); border: 2px solid var(--learning-paper); border-radius: 9px; }
.learning-material a { text-underline-offset: 4px; }
.learning-material .learning-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px 28px;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto 28px;
  padding: 0 0 24px;
  border: 0;
  border-bottom: 1px solid var(--learning-line);
  background: transparent;
  text-align: left;
}
.learning-material .learning-heading { flex: 1 1 360px; min-width: 0; }
.learning-material .learning-heading h1 {
  margin: 0;
  color: var(--learning-ink);
  font-family: var(--learning-font);
  font-weight: 600;
  line-height: 1.4;
  font-size:var(--learning-title-size);
  letter-spacing: -.025em;
  white-space: normal;
  text-wrap: balance;
}
.learning-material .learning-back {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin: -10px 0 6px;
  color: var(--learning-muted);
  font-size: 15px;
  text-decoration: none;
}
.learning-material .learning-back:hover { text-decoration: underline; }
.learning-material .learning-heading .learning-subtitle {
  max-width: 70ch;
  margin: 2px 0 0;
  color: var(--learning-muted);
  font-size: 15px;
  line-height: 1.6;
}
.learning-material .learning-tools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
.learning-material .learning-tools label { display: grid; gap: 6px; color: var(--learning-muted); font-size: 14px; }
.learning-material .learning-tools select {
  min-width: 128px;
  max-width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--learning-control-line);
  border-radius: 6px;
  background: var(--learning-sheet);
  color: var(--learning-ink);
  font-size: 16px;
}
.learning-material .learning-body { width: 100%; max-width: 1120px; min-width: 0; margin-inline: auto; }
.learning-material .learning-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 14px;
  border: 1px solid var(--learning-control-line);
  border-radius: 6px;
  background: var(--learning-sheet);
  color: var(--learning-ink);
  font: 500 15px/1.5 var(--learning-font);
  text-decoration: none;
}
.learning-material .learning-button:hover { background: var(--learning-tint); border-color: var(--learning-accent); }
.learning-material .learning-button[aria-pressed=true], .learning-material .learning-button-primary {
  border-color: var(--learning-accent);
  background: var(--learning-selected);
  color: var(--learning-ink);
}
.learning-material button:disabled { opacity: .5; cursor: default; }
body.learning-material { padding: 32px 24px 56px; }
body.learning-material.learning-embedded { padding: 0 0 24px; min-height: 0; }
.learning-material .learning-note { margin: 12px 0; color: var(--learning-muted); font-size: 15px; }
.learning-material .learning-example { border: 1px solid var(--learning-line); border-radius: 12px; padding: 14px 16px; background: var(--learning-warm); }
.learning-material .learning-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 0 0 28px; }
.learning-material .learning-steps button {
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--learning-line);
  border-radius: 8px;
  background: var(--learning-sheet);
  color: var(--learning-muted);
  font-size: 15px;
  text-align: left;
}
.learning-material .learning-steps button[aria-current=step] { border-color: var(--learning-ink); background: var(--learning-ink); color: #fff; }
/* A compact scene picker retains direct navigation on narrow screens. */
.learning-material .learning-mobile-scene-picker { display: none; }
@media (max-width: 720px) {
  .learning-material .learning-mobile-scene-picker { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--learning-muted); }
  .learning-material .learning-mobile-scene-picker select { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--learning-control-line); border-radius: 6px; padding: 8px 12px; color: var(--learning-ink); background: #fff; font: inherit; }
  .learning-story :is(#chapters, .chapter-label) { display: none; }

  body.learning-material { padding: 24px 20px 40px; }
  body.learning-material.learning-embedded { padding: 0 0 20px; }
  .learning-material .learning-header { margin-bottom: 24px; padding-bottom: 20px; gap: 16px; }
  .learning-material .learning-heading { flex-basis: 100%; }
  .learning-material .learning-tools { width: 100%; }
  .learning-material .learning-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .learning-material *, .learning-material *::before, .learning-material *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}
@media print {
  body.learning-material { padding: 0; background: #fff; }
  .learning-material .learning-header { margin-bottom: 20px; padding-bottom: 12px; }
  .learning-material :is(.learning-back, .learning-tools, .learning-steps) { display: none !important; }
}

/* Five learning formats: shared geometry, selection, and terminal actions. */
.learning-material .learning-action-row {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:16px; width:100%; margin-top:28px; padding-top:20px;
  border-top:1px solid var(--learning-line);
}
.learning-material .learning-action-row > :last-child { margin-inline-start:auto; }
.learning-material .learning-action-row .learning-button { min-width:160px; border-radius:var(--learning-radius-control); }
.learning-material .learning-action-row .learning-button-primary {
  background:var(--learning-ink); border-color:var(--learning-ink); color:#fff;
}
.learning-material .learning-action-row .learning-button-primary:hover { background:#354a30; }
.learning-material.learning-story :is(button,select,.btn) { border-radius:var(--learning-radius-control); }
.learning-material.learning-story :is(.bubble,.resource,.practice,.after,.overview,.note) { border-radius:var(--learning-radius); }
.learning-material.learning-story :is(.story-scene-image,.scene-img) { border-radius:var(--learning-radius); }
.learning-material.learning-story .ch-nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; width:100%; }
.learning-material.learning-story .ch-nav button { width:100%; min-height:48px; }
.learning-material.learning-story .ch-nav button:last-child { background:var(--learning-ink); border-color:var(--learning-ink); color:#fff; }
.learning-material.learning-story .scene-button[aria-pressed=true] { border-color:var(--learning-ink); background:var(--learning-ink); color:#fff; font-weight:600; }
.learning-material.learning-story .scene-button[aria-pressed=true] small { color:inherit; }
.learning-material.learning-story .after-activities label:has(input:checked) { background:var(--learning-selected); outline:1px solid var(--learning-accent); outline-offset:-1px; border-radius:var(--learning-radius-control); }
.learning-material.learning-story .after-activities label { padding:10px 12px; }

<script>
// Cards: q/qs = front (normal mode), a/rom/pron/note = back (normal mode)
// In reverse mode: front shows a (the Korean word), back shows q (number)
const ALL_CARDS = [
  // ── SINO-KOREAN ──
  { cat:'sino', q:'1', qs:'What is 1 in Sino-Korean?', a:'일', rom:'il', pron:'[일]', note:'' },
  { cat:'sino', q:'2', qs:'What is 2 in Sino-Korean?', a:'이', rom:'i', pron:'[이]', note:'⚠ "i" — standard romanization (not "ee")' },
  { cat:'sino', q:'3', qs:'What is 3 in Sino-Korean?', a:'삼', rom:'sam', pron:'[삼]', note:'' },
  { cat:'sino', q:'4', qs:'What is 4 in Sino-Korean?', a:'사', rom:'sa', pron:'[사]', note:'' },
  { cat:'sino', q:'5', qs:'What is 5 in Sino-Korean?', a:'오', rom:'o', pron:'[오]', note:'' },
  { cat:'sino', q:'6', qs:'What is 6 in Sino-Korean?', a:'육', rom:'yuk', pron:'[육]', note:'⚠ Before 월 → 유: 6월 = [유월]' },
  { cat:'sino', q:'7', qs:'What is 7 in Sino-Korean?', a:'칠', rom:'chil', pron:'[칠]', note:'' },
  { cat:'sino', q:'8', qs:'What is 8 in Sino-Korean?', a:'팔', rom:'pal', pron:'[팔]', note:'' },
  { cat:'sino', q:'9', qs:'What is 9 in Sino-Korean?', a:'구', rom:'gu', pron:'[구]', note:'' },
  { cat:'sino', q:'10', qs:'What is 10 in Sino-Korean?', a:'십', rom:'sip', pron:'[십]', note:'받침 ㅂ → links to next vowel: 십일 → [시빌]' },
  { cat:'sino', q:'16', qs:'How do you say 16? (watch the pronunciation!)', a:'십육', rom:'sib-yuk', pron:'[심뉵] ← ㄴ insertion!', note:'십 + 육 → 심뉵 (nasal assimilation)' },
  { cat:'sino', q:'20', qs:'How do you say 20 in Sino-Korean?', a:'이십', rom:'i-sip', pron:'[이십]', note:'' },
  { cat:'sino', q:'66', qs:'How do you say 66? (tricky!)', a:'육십육', rom:'yuk-sip-yuk', pron:'[육씹뉵]', note:'The middle 십 becomes [씹] before 육' },
  { cat:'sino', q:'100', qs:'How do you say 100?', a:'백', rom:'baek', pron:'[백]', note:'' },

  // ── NATIVE KOREAN — number shown, Korean asked ──
  { cat:'native', q:'1', qs:'What is 1 in Native Korean?', a:'하나', rom:'ha-na', pron:'[하나]', note:'Before a counter → 한: 한 개, 한 명' },
  { cat:'native', q:'2', qs:'What is 2 in Native Korean?', a:'둘', rom:'dul', pron:'[둘]', note:'Before a counter → 두: 두 개, 두 명' },
  { cat:'native', q:'3', qs:'What is 3 in Native Korean?', a:'셋', rom:'set', pron:'[셋]', note:'Before a counter → 세: 세 시, 세 개' },
  { cat:'native', q:'4', qs:'What is 4 in Native Korean?', a:'넷', rom:'net', pron:'[넷]', note:'Before a counter → 네: 네 시, 네 마리' },
  { cat:'native', q:'5', qs:'What is 5 in Native Korean?', a:'다섯', rom:'da-seot', pron:'[다섯]', note:'' },
  { cat:'native', q:'6', qs:'What is 6 in Native Korean?', a:'여섯', rom:'yeo-seot', pron:'[여섯]', note:'' },
  { cat:'native', q:'7', qs:'What is 7 in Native Korean?', a:'일곱', rom:'il-gop', pron:'[일곱]', note:'' },

  { cat:'native', q:'9', qs:'What is 9 in Native Korean?', a:'아홉', rom:'a-hop', pron:'[아홉]', note:'' },

  { cat:'native', q:'30', qs:'What is 30 in Native Korean?', a:'서른', rom:'seo-reun', pron:'[서른]', note:'' },

  { cat:'native', q:'60', qs:'What is 60 in Native Korean?', a:'예순', rom:'ye-sun', pron:'[예순]', note:'' },

  { cat:'time', q:'3:45', qs:'How do you say 3:45?', a:'세 시 사십오 분', rom:'se si / sa-sip-o bun', pron:'[세 시 사시보 분]', note:'Hours → Native Korean · Minutes → Sino-Korean' },
  { cat:'time', q:'12:00', qs:'How do you say 12 o\'clock?', a:'열두 시', rom:'yeol-du si', pron:'[열두 시]', note:'열두 = 열(10) + 두(2)' },
  { cat:'time', q:'30분', qs:'30분 in Korean numbers?', a:'삼십 분', rom:'sam-sip bun', pron:'[삼십 분]', note:'Minutes always use Sino-Korean' },
  { cat:'time', q:'3:30 shortcut', qs:'How do most Koreans say 3:30?', a:'세 시 반', rom:'se si ban', pron:'[세 시 반]', note:'반(半) = 30 minutes — much more natural in speech!' },
  { cat:'time', q:'시 vs 시간', qs:'What\'s the difference between 시 and 시간?', a:'시 = point\n시간 = duration', rom:'si / si-gan', pron:'', note:'세 시에 만나요 (at 3)\n세 시간 걸려요 (for 3 hours)' },
  { cat:'time', q:'6월', qs:'How do you pronounce 6월?', a:'유월', rom:'yu-wol', pron:'[유월] ✔  [육월] ✗', note:'육 → 유 before 월 — irregular exception!' },
  { cat:'time', q:'10월', qs:'How do you pronounce 10월?', a:'시월', rom:'si-wol', pron:'[시월] ✔  [십월] ✗', note:'십 → 시 before 월 — irregular exception!' },

  // ── AGE ──
  { cat:'age', q:'스무 살 vs 이십 세', qs:'Which is more formal for age 20?', a:'이십 세', rom:'i-sip se', pron:'', note:'살 = everyday · 세 = formal/official\n(hospital, documents, public records)' },
  { cat:'age', q:'52 살', qs:'How do you say age 52 (everyday)?', a:'쉰두 살', rom:'swin-du sal', pron:'[쉰두 살]', note:'쉰(50) + 두(2) + 살' },
  { cat:'age', q:'74 세', qs:'How do you say age 74 (formal)?', a:'칠십사 세', rom:'chil-sip-sa se', pron:'', note:'' },
  { cat:'age', q:'환갑', qs:'환갑 = ?', a:'60세', rom:'hwan-gap', pron:'[환갑]', note:'Important traditional milestone — 60th birthday celebration' },
  { cat:'age', q:'칠순 / 고희', qs:'칠순 and 고희 = ?', a:'70세', rom:'chil-sun / go-hui', pron:'', note:'칠순 = common · 고희(古稀) = formal/literary' },
  { cat:'age', q:'팔순 / 구순', qs:'팔순, 구순 = ?', a:'80세 / 90세', rom:'pal-sun / gu-sun', pron:'', note:'' },

  // ── PHONE ──
  { cat:'phone', q:'010', qs:'How do you read 010 in a phone number?', a:'공일공', rom:'gong-il-gong', pron:'[공일공]', note:'Phone numbers: use 공 for 0, NOT 영' },
  { cat:'phone', q:'213\n(phone digit)', qs:'How do you avoid 이/일 confusion in 213?', a:'이 · 일 · 삼', rom:'i · il · sam', pron:'', note:'Say each digit with a slight pause between!\nDO NOT say 이일삼 (sounds like gibberish)' },
  { cat:'phone', q:'영 vs 공', qs:'When to use 영 vs 공 for zero?', a:'영 → math\n공 → phone/address', rom:'yeong / gong', pron:'', note:'영 대 영 (0:0 score) · 영하 오도 (−5°C)\n공일공-xxxx (phone) · 302호 → 삼공이호' },
  { cat:'phone', q:'010-2345-6789', qs:'Read this full number aloud', a:'공일공\n이삼사오\n육칠팔구', rom:'gong-il-gong / i-sam-sa-o / yuk-chil-pal-gu', pron:'', note:'Each segment is read as individual digits' },

  // ── ORDINAL ──
  { cat:'ordinal', q:'1st', qs:'How do you say "first" in Korean?', a:'첫 번째', rom:'cheot beon-jjae', pron:'[첫 번째]', note:'⚠ 첫 is IRREGULAR — not 한 번째!' },
  { cat:'ordinal', q:'2nd', qs:'How do you say "second"?', a:'두 번째', rom:'du beon-jjae', pron:'[두 번째]', note:'둘 → 두 (shortened before counter)' },
  { cat:'ordinal', q:'3rd', qs:'How do you say "third"?', a:'세 번째', rom:'se beon-jjae', pron:'[세 번째]', note:'셋 → 세 (shortened before counter)' },
  { cat:'ordinal', q:'4th', qs:'How do you say "fourth"?', a:'네 번째', rom:'ne beon-jjae', pron:'[네 번째]', note:'넷 → 네 (shortened before counter)' },
  { cat:'ordinal', q:'5th+', qs:'Pattern for 5th and beyond?', a:'다섯 번째\n여섯 번째…', rom:'da-seot beon-jjae', pron:'', note:'From 5th onward: Native Korean number + 번째\nNo shortening needed!' },
  { cat:'ordinal', q:'번째 rule', qs:'What\'s the ordinal pattern in Korean?', a:'Native # + 번째', rom:'beon-jjae', pron:'[번째]', note:'첫(1st) is irregular\n둘→두 / 셋→세 / 넷→네 for 2nd–4th\n5th+ uses full Native form' },
];

let filtered = [...ALL_CARDS];
let idx = 0;
let isFlipped = false;
let currentCat = 'all';
let mode = 'normal'; // 'normal' = Number→Korean, 'reverse' = Korean→Number

function getColorForCat(cat) {
  return { sino:'#b84835', native:'#247867', time:'#44583d', age:'#906115', phone:'#7252ad', ordinal:'#22756e' }[cat] || '#44583d';
}
function getLabelForCat(cat) {
  return { sino:'한자 수', native:'고유어 수', time:'시간', age:'나이', phone:'전화번호', ordinal:'순서' }[cat] || cat;
}
function getEnglishLabelForCat(cat) {
  return { sino:'Sino-Korean', native:'Native Korean', time:'Time', age:'Age', phone:'Phone', ordinal:'Ordinal' }[cat] || cat;
}
function setBilingualLabel(element, korean, english) {
  element.innerHTML = '<span class="bi-label"><span lang="ko">' + korean + '</span><small lang="en">' + english + '</small></span>';
}

function renderCard() {
  if (!filtered.length) return;
  const c = filtered[idx];
  const color = getColorForCat(c.cat);
  const label = getLabelForCat(c.cat);

  // Determine front/back based on mode
  // In 'normal' mode: front = q (number/concept), back = a (Korean/answer)
  // In 'reverse' mode for sino/native: front = a (Korean), back = q (number)
  // For other cats (time/age/phone/ordinal): always normal direction
  const canReverse = (c.cat === 'sino' || c.cat === 'native');
  const useReverse = (mode === 'reverse' && canReverse);

  const frontText = useReverse ? c.a : c.q;
  const frontSub  = useReverse ? ('What number is ' + c.a + '?') : c.qs;
  const backText  = useReverse ? c.q : c.a;
  const backRom   = useReverse ? '' : (c.rom || '');
  const backPron  = useReverse ? (c.rom ? c.rom : '') : (c.pron || '');
  const backPronFull = useReverse ? (c.pron || '') : (c.pron || '');
  const backNote  = c.note || '';

  // Tags
  ['card-tag-f','card-tag-b'].forEach(id => {
    const el = document.getElementById(id);
    setBilingualLabel(el, label, getEnglishLabelForCat(c.cat));
    el.className = 'card-tag tag-' + c.cat;
    el.style.background = color;
  });

  // Front
  const qEl = document.getElementById('card-q');
  qEl.textContent = frontText;
  const isNum = /^[\d,\s:]+$/.test(frontText.trim());
  const isEn  = /^[a-zA-Z\s\d:,.\/\-'?]+$/.test(frontText.trim());
  qEl.className = 'card-question' + (isNum ? ' num' : (isEn ? ' en' : ''));
  document.getElementById('card-sub').textContent = frontSub || '';
  const direction = document.getElementById('card-dir-f');
  if (canReverse) {
    setBilingualLabel(direction, useReverse ? '한국어 → 숫자' : '숫자 → 한국어', useReverse ? 'Korean → Number' : 'Number → Korean');
  } else {
    direction.textContent = '';
  }

  // Back
  const ansEl = document.getElementById('card-ans');
  ansEl.textContent = backText;
  ansEl.style.color = color;
  const backIsKo = /[가-힣]/.test(backText);
  const backIsEn = /^[a-zA-Z\s\d:,.\/\-'?≠·×✔✗]+$/.test(backText.trim());
  ansEl.className = 'card-answer-main' + (backIsEn && !backIsKo ? ' en' : '');

  document.getElementById('card-rom').textContent  = useReverse ? (c.pron || '') : (c.rom || '');
  document.getElementById('card-pron').textContent = useReverse ? '' : (c.pron || '');
  document.getElementById('card-pron').style.color = color;
  document.getElementById('card-note').textContent = backNote;

  // progress
  const pct = filtered.length > 1 ? (idx / (filtered.length - 1)) * 100 : 100;
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('prog').style.background = color;
  document.getElementById('prog-label').textContent = (idx+1) + ' / ' + filtered.length;

  isFlipped = false;
  document.getElementById('card-inner').classList.remove('flipped');
  updateCardAccessibility();
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-normal').classList.toggle('active', m === 'normal');
  document.getElementById('mode-reverse').classList.toggle('active', m === 'reverse');
  document.getElementById('mode-normal').setAttribute('aria-pressed', String(m === 'normal'));
  document.getElementById('mode-reverse').setAttribute('aria-pressed', String(m === 'reverse'));
  renderCard();
}

function updateCardAccessibility() {
  const front = document.querySelector('.card-front');
  const back = document.querySelector('.card-back');
  front.setAttribute('aria-hidden', String(isFlipped));
  back.setAttribute('aria-hidden', String(!isFlipped));
  const visible = isFlipped ? back : front;
  document.getElementById('card-scene').setAttribute('aria-label', visible.textContent.replace(/\s+/g, ' ').trim());
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card-inner').classList.toggle('flipped', isFlipped);
  updateCardAccessibility();
}
function next() { idx = (idx + 1) % filtered.length; renderCard(); }
function prev() { idx = (idx - 1 + filtered.length) % filtered.length; renderCard(); }
function shuffle() {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  idx = 0; renderCard();
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    currentCat = btn.dataset.cat;
    filtered = currentCat === 'all' ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.cat === currentCat);
    idx = 0; renderCard();
  });
});

document.getElementById('card-scene').addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (e.key === ' ' && e.target.closest('button, a')) return;
  if (e.key === 'Enter' && e.target.id === 'card-scene') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 's' || e.key === 'S') shuffle();
  else if (e.key === 'r' || e.key === 'R') setMode(mode === 'normal' ? 'reverse' : 'normal');
});

renderCard();
</script>

</body>
</html>
